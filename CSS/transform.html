<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        div 
        {
            width:300px;
            height:300px;
            margin:100px auto;
            position: relative;
            overflow:hidden;
        }
        div>img 
        {
            width:inherit;
            height:inherit;
            filter:scale(100%);
            transition:all 1s linear 2s;
        }
        div:hover>img 
        {
            filter:grayscale(0%);
            transform:scale(1.2,1.2);
        }
        div:hover 
        {
            cursor:pointer;
        }

        /* Styles For Wrapper Element */
        #wrapper-ele
        {
            background-color:wheat;
            position:absolute;
            top:-100px;
            left:0px;
            transition:all 1s linear 1s;
        }
        div:hover>#wrapper-ele
        {
            transform:translateY(-100%);
        }

        /* Left Door Styles */
        #left-door
        {
            
            position:absolute;
            top:-100px;
            left:0px;
            width:50%;
            transition:all 1s linear 0s;
            transform-origin:left;
        }
        div:hover>#left-door
        {
            transform:perspective(200px) rotateY(90deg);
        }
        #left-door>img{
          height:inherit;
          width:300px;
          
            
        }

        /* Right Door Styles */
        #right-door
        {
            
            position:absolute;
            top:-100px;
            left:50%;
            width:50%;
            transition:all 1s linear 0s;
            transform-origin:right;
        }
        div:hover>#right-door
        {
            transform:perspective(200px) rotateY(-90deg);
        }
        #right-door>img{
          height:inherit;
          width:300px;
        }
    </style>
</head>
<body>
    <div>
        <img src="./arshu.jpeg" alt="">

        <div id="wrapper-ele">
          <img src="https://tse1.mm.bing.net/th/id/OIP.Hz89uh9LJYsHhi9ZrA6lygHaHa?pid=Api&P=0&h=180" alt="">
        </div>

        <div id="left-door">
          <img src="https://tse2.mm.bing.net/th/id/OIP.aI63CvpuEJ2NR2Mdw3hJ_QHaIP?pid=Api&P=0&h=180" alt="">
        </div>

        <div id="right-door">
          <img src="https://tse2.mm.bing.net/th/id/OIP.aI63CvpuEJ2NR2Mdw3hJ_QHaIP?pid=Api&P=0&h=180">
        </div>
    </div>
</body>
</html>
