<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>

<body>

    <div class="row">
      <div class="col-7 m-auto">

          <div class="card-header bg-dark text-white text-center">
            <h2>Items need to carry for attending class...?</h2>
          </div>

          <div class="card-body">
            <form>
              <div class="mb-2">

              </div>

              <div class="mb-2">
                <input type="submit"  class="btn btn-dark">
              </div>
            </form>
          </div>
        </div>

      </div>

    </div>
  </section>


  <section class="container-fluid mt-5">
    <div class="row">
      <div class="col-7 m-auto">
        <div class="card-body">
          <ol class="list-group">
            <li class="list-group-item list-group-item-dark mb-2">
              <span class="fw-bold">laptop</span>
              <button class="float-end">❌</button>
              <button class="float-end me-2">✍️</button>

            </li>
            <li class="list-group-item list-group-item-dark mb-2">
              <span class="fw-bold">Notebooks</span>
              <button class="float-end">❌</button>
              <button class="float-end me-2">✍️</button>
            </li>
            <li class="list-group-item list-group-item-dark mb-2">
              <span class="fw-bold">pens</span>
              <button class="float-end">❌</button>
              <button class="float-end me-2">✍️</button>
            </li>
          </ol>
  <script src="./../Bs/bootstrap-5.3.8-dist/js/bootstrap.js">
