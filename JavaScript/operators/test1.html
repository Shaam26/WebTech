<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
  <script>
    let a=1;
    a=a++ + a;
    console.log(a);//3
    a=++a;
    console.log(a);//4
    console.log(a+++a);//9
    console.log(a++);//5
    console.log(a);//6





    let b=1;
    let c=0;
    c=b++ + ++b;//4
    c=b--;//3
    b=--b;//1
    console.log(b,c)//1,3
;

  </script>
</head>
<body>
  <h1>
    Js operators
  </h1>
  
</body>
</html>
