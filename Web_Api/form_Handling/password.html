<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link rel="stylesheet" href="./../../Bs/bootstrap-5.3.8-dist/css/bootstrap.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      img {
        height: 200px !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">🛒 AMAZON</a>
      </div>
    </nav>

    <section class="container-fluid mt-4">
      <div class="row">
        <div class="col-5 m-auto">
          <div class="card">
            <div class="card-header bg-dark text-white text-center">
              <h2>LogIn Form</h2>
            </div>
            <div class="card-body">
              <form>
                <div class="mb-2">
                  <input
                    type="password"
                    placeholder="Enter Password"
                    class="form-control"
                    id="pw-ele"
                  />
                </div>
                <div>
                  <button class="btn btn-dark" id="pw-btn">
                    Show Password
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer style="margin-bottom: 400px"></footer>

    <!-- Script Code -->
    <script>
      let pwBtn = document.getElementById("pw-btn");
      let pwEle = document.getElementById("pw-ele");

      pwBtn.addEventListener("click", function (e) {
        e.preventDefault();

        if (pwEle.value != "") 
        {
          let str = pwEle.getAttribute("type");

          if (str == "password") 
          {
            pwEle.setAttribute("type", "text");
            pwBtn.textContent = "Hide Password";
          } 
          else 
          {
            pwEle.setAttribute("type", "password");
            pwBtn.textContent = "Show Password";
          }
        }
      });
    </script>
  </body>
</html>
