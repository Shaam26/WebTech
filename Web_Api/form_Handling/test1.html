<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>

  <link rel="stylesheet" href="./../../Bs/bootstrap-5.3.8-dist/./css/bootstrap.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
</head>

<body>
  <nav class="navbar bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🛒 Amazon</a>
    </div>
  </nav>

   <section class="container-fluid">
    <div class="row">
      <div class="col">
        
      </div>
      </div>
      </section>

      <div class="col-4 m-auto">
        <div class="card">
          <div class="card-header bg-dark text-white text-center">
            <h2>Username Box</h2>
          </div>
          <div class="card-body">
            <form>
              <input type="text" placeholder="Enter Username" class="form-control"
              id="usn-box"/>
            </form>
          </div>
          <div class="card-footer bg-dark text-white text-center">
            <h2 id="display-name">Username</h2>
          </div>


        </div>
      </div>



  
            
        
  
   <script>
    let usnEle=document.getElementById('usn-box');
    let displayEle=document.getElementById('display-name');

    usnEle.addEventListener('keyup',function()
  {
    let enteredName=usnEle.value;
    displayEle.textContent=enteredName;
  });
   
  </script>
 

  
  
</body>
</html>
