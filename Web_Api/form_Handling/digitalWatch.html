<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link rel="stylesheet" href="./../../Bs/bootstrap-5.3.8-dist/css/bootstrap.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      img {
        height: 200px !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">🛒 AMAZON</a>
      </div>
    </nav>

    <section class="container-fluid mt-4">
      <div class="row">
        <div class="col-4 m-auto">
          <div class="card">
            <div class="card-body text-center">
        
            <h2>Digital Watch</h2>
            <h5>Asia/Kolkata</h5>
            <h3  id="time-ele">time</h3>
            <h5  id="date-ele">date</h5>

          
            </div>
         
             </div>     
               
            </div>
          </div>
       
    </section>
    <footer style="margin-bottom:400px"></footer>


    <!-- Script Code -->
    <script>
      let timeEle=document.getElementById("time-ele");
      let dateEle=document.getElementById("date-ele");


      function timer(){
        let d1=new Date();
        let currTime=d1.toLocaleTimeString();
        let currDate=d1.toLocaleDateString();
        timeEle.textContent=currTime;
        dateEle.textContent=currDate;
      }
       
      //timer();
      setInterval(timer,1000);
      
      
    </script>
  </body>
</html>
