<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link rel="stylesheet" href="./../../Bs/bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      img {
        height: 200px !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">🛒 AMAZON</a>
      </div>
    </nav>

    <section class="container-fluid mt-4">
      <div class="row">
        <div class="col-5 m-auto">
          <div class="card">
            <div class="card-header bg-dark text-white text-center">
              <h2>LogIn Form</h2>
            </div>
            <div class="card-body">
              <form>
                <div class="input-group mb-3">
                  <div class="input-group-text">
                    <input class="form-check-input" type="checkbox" id="check-box"/>
                  </div>
                  <input type="password" class="form-control" placeholder="Enter Password" id="pw-ele"/>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer style="margin-bottom: 400px"></footer>

    <!-- Script Code -->
    <script>
      let checkBox = document.getElementById("check-box");
      let pwEle = document.getElementById("pw-ele");

        checkBox.addEventListener("change", function() 
        {
            if (pwEle.value != "") 
            {
                let str = pwEle.getAttribute("type");

                if (str == "password") 
                {
                    pwEle.setAttribute("type", "text");
                } 
                else 
                {
                    pwEle.setAttribute("type", "password");
                }
            }
        });
    </script>
  </body>
</html>
