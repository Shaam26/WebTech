<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>

  <link rel="stylesheet" href="./../../Bs/bootstrap-5.3.8-dist//css/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <section class="container-fluid" mt-5>
    <div class="row">
      <div class="col">
        <table class="table text-center">
          <thead class="table-dark">
            <tr>
              <th>S.NO</th>
              <th>ITEM</th>
              <th>CATEGORY</th>
              <th>PRICE</th>
              <th>QTY</th>
              <th>TOTAL PRICE</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>101</td>
              <td>
                <img src="https://tse1.mm.bing.net/th/id/OIP.AgB2zLYnSsodMSk6VPU1pgHaE8?pid=Api&rs=1&c=1&qlt=95&w=149&h=99" alt="" class="img-fluid" width="20px" height="20px">

              </td>
              <td>Electronics</td>
              <td>&dollar; 114.00</td>
              <td>
                <i class="bi bi-dash-circle" id="minus-btn"></i>
                <span id="qty-ele"></span>
                <i class="bi bi-plus-circle" id="plus-btn"></i>
              </td>             
                <td>&dollar; 114.00</td> 
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
  <script>
    let plusBtn=document.getElementById('plus-btn');
     let minusBtn=document.getElementById('minus-btn');
     let qtyEle=document.getElementById('qty-ele');

     let qty=1;
     qtyEle.textContent=qty;

     plusBtn.addEventListener('click',function()
    {
      qty=qty+1;
      qtyEle.textContent=qty;
    })

    minusBtn.addEventListener('click',function()
  {
    if(qty>1)
  {
    qty=qty-1;
    qtyEle.textContent=qty;
  }
  })
  </script>
</body>
</html>
